<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deep Space Blade — Sprite Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07070f;color:#b8c4e0;font-family:'SF Mono',Consolas,monospace;font-size:12px;min-height:100vh;padding:20px}
h1{color:#00d4ff;font-size:16px;letter-spacing:3px;margin-bottom:4px}
.sub{color:#3a4060;font-size:11px;margin-bottom:20px}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.toolbar label{color:#4a5080;font-size:11px}
select{background:#141428;border:1px solid #2a2a4a;color:#b8c4e0;padding:3px 8px;border-radius:3px;font-family:inherit;font-size:11px}
.btn{background:#141428;border:1px solid #2a2a4a;color:#b8c4e0;padding:5px 14px;border-radius:3px;cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:1px;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:#00d4ff;color:#00d4ff}
.btn.green{border-color:#1e3a1e}.btn.green:hover{border-color:#44ff88;color:#44ff88}
.grid{display:flex;flex-direction:column;gap:28px}
.sprite-card{background:#0d0d1e;border:1px solid #1e1e3a;border-radius:6px;padding:16px}
.card-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.card-header h2{color:#00d4ff;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;flex:1}
.card-header .tag{color:#3a4060;font-size:10px}
.frames-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.frame-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.frame-label{color:#3a4060;font-size:9px;letter-spacing:0.5px}
.frame-active{outline:2px solid #00d4ff;outline-offset:2px;border-radius:2px}
canvas.sprite{background:#0a1520;border-radius:3px;image-rendering:pixelated;cursor:pointer}
.anim-preview{background:#0a1520;border-radius:3px;outline:1px solid #1e1e3a}
.card-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.fps-label{color:#4a5080;font-size:10px;margin-left:4px}
</style>
</head>
<body>
<h1>⚡ DEEP SPACE BLADE — SPRITE GENERATOR</h1>
<p class="sub">Multi-frame animated sprites • Click a frame to export it • Export All downloads every frame</p>

<div class="toolbar">
  <label>Export Scale:</label>
  <select id="scaleSel" onchange="redrawAll()">
    <option value="2">2×</option>
    <option value="3" selected>3× Retina</option>
    <option value="4">4×</option>
  </select>
  <label>Preview FPS:</label>
  <select id="fpsSel">
    <option value="6">6 fps</option>
    <option value="8">8 fps</option>
    <option value="10" selected>10 fps</option>
    <option value="15">15 fps</option>
  </select>
  <button class="btn green" onclick="exportAll()">⬇ Export All Frames</button>
  <button class="btn" onclick="stopAllPreviews()">■ Stop All Previews</button>
</div>

<div class="grid" id="grid"></div>

<script>
// ─── Sprite registry ─────────────────────────────────────────────────────────
const SPRITES = [
  { id:'player_ship',      label:'Player Ship',      w:48,  h:52,  frames:3,  draw:drawPlayer    },
  { id:'enemy_grunt',      label:'Grunt Fighter',    w:36,  h:34,  frames:4,  draw:drawGrunt     },
  { id:'enemy_fighter',    label:'Alpha Fighter',    w:42,  h:40,  frames:4,  draw:drawFighter   },
  { id:'enemy_commander',  label:'Commander',        w:52,  h:50,  frames:4,  draw:drawCommander },
  { id:'boss_iron_hydra',  label:'Boss — Iron Hydra',w:96,  h:90,  frames:4,  draw:drawBoss      },
  { id:'bullet_player',    label:'Player Bullet',    w:6,   h:18,  frames:2,  draw:drawBulletPlayer},
  { id:'bullet_enemy',     label:'Enemy Bullet',     w:8,   h:14,  frames:2,  draw:drawBulletEnemy },
  { id:'bullet_enemy_red', label:'Red Bullet',       w:8,   h:14,  frames:2,  draw:drawBulletRed   },
  { id:'bullet_boss',      label:'Boss Bullet',      w:12,  h:18,  frames:3,  draw:drawBulletBoss  },
];

let animIntervals = {};
function scale(){ return +document.getElementById('scaleSel').value; }
function fps()  { return +document.getElementById('fpsSel').value; }

// ─── Math helpers ─────────────────────────────────────────────────────────────
// t = 0..1 cyclic phase. Returns value oscillating between lo and hi.
function pulse(t,lo,hi,phase=0){ return lo+(hi-lo)*(0.5+0.5*Math.sin((t+phase)*Math.PI*2)); }
function lerp(a,b,t){ return a+(b-a)*t; }

// ─── Draw helpers ─────────────────────────────────────────────────────────────
function glow(ctx,color,blur){ ctx.shadowColor=color; ctx.shadowBlur=blur; }
function noGlow(ctx){ ctx.shadowColor='transparent'; ctx.shadowBlur=0; }
function radial(ctx,x,y,r0,r1,stops){
  const g=ctx.createRadialGradient(x,y,r0,x,y,r1);
  stops.forEach(([t,c])=>g.addColorStop(t,c)); return g;
}
function linear(ctx,x0,y0,x1,y1,stops){
  const g=ctx.createLinearGradient(x0,y0,x1,y1);
  stops.forEach(([t,c])=>g.addColorStop(t,c)); return g;
}
// t=0..1 → hex brightness multiplier
function bright(hex,t){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r*t|0),Math.min(255,g*t|0),Math.min(255,b*t|0)})`;
}
function alpha(color,a){ return color.replace(')',`,${a})`).replace('rgb(','rgba('); }

// ─── PLAYER SHIP (3 frames) ───────────────────────────────────────────────────
// frame=0: idle  1: engine mid-pulse  2: engine full-pulse
function drawPlayer(ctx,W,H,frame,total){
  const cx=W/2;
  const s=W/2;
  const ft = frame/(total-1||1);             // 0..1 across frames
  const engineBright = lerp(0.55, 1.0, ft);
  const engineBlur   = lerp(12, 28, ft);
  const tipBright    = lerp(0.6, 1.0, ft);

  // Engine trail
  const trail=radial(ctx,cx,H*0.88,0,s*0.55,[
    [0,`rgba(0,${160*engineBright|0},255,${0.35+0.35*ft})`],
    [0.5,`rgba(0,80,200,${0.1+0.1*ft})`],
    [1,'transparent']
  ]);
  ctx.fillStyle=trail; ctx.fillRect(cx-s*0.5,H*0.7,s,H*0.3);

  // Engine pods
  drawEngine(ctx,cx-s*0.38,H*0.78,s*0.14,s*0.22,engineBright,engineBlur);
  drawEngine(ctx,cx+s*0.38,H*0.78,s*0.14,s*0.22,engineBright,engineBlur);

  // Wing shadows
  for(const d of[-1,1]){
    ctx.beginPath();
    ctx.moveTo(cx,H*0.18); ctx.lineTo(cx+d*s*0.95,H*0.72);
    ctx.lineTo(cx+d*s*0.55,H*0.62); ctx.lineTo(cx+d*s*0.28,H*0.32);
    ctx.closePath(); ctx.fillStyle='rgba(30,50,80,0.7)'; ctx.fill();
  }
  // Wings
  for(const d of[-1,1]){
    ctx.beginPath();
    ctx.moveTo(cx,H*0.20); ctx.lineTo(cx+d*s*0.88,H*0.68);
    ctx.lineTo(cx+d*s*0.50,H*0.58); ctx.lineTo(cx+d*s*0.24,H*0.30);
    ctx.closePath();
    const stops=d<0?[[0,'#1a3a5c'],[0.4,'#2d6a9a'],[0.8,'#4a90c8'],[1,'#80b8e0']]
                   :[[0,'#80b8e0'],[0.2,'#4a90c8'],[0.6,'#2d6a9a'],[1,'#1a3a5c']];
    ctx.fillStyle=linear(ctx,d<0?cx-s*0.88:cx,0,d<0?cx:cx+s*0.88,0,stops); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx+d*s*0.1,H*0.24); ctx.lineTo(cx+d*s*0.78,H*0.62);
    ctx.strokeStyle=`rgba(100,200,255,0.35)`; ctx.lineWidth=W*0.025; ctx.stroke();
  }
  // Fuselage
  ctx.beginPath();
  ctx.moveTo(cx,H*0.04); ctx.lineTo(cx+s*0.20,H*0.26); ctx.lineTo(cx+s*0.22,H*0.72);
  ctx.lineTo(cx+s*0.16,H*0.84); ctx.lineTo(cx,H*0.80);
  ctx.lineTo(cx-s*0.16,H*0.84); ctx.lineTo(cx-s*0.22,H*0.72); ctx.lineTo(cx-s*0.20,H*0.26);
  ctx.closePath();
  ctx.fillStyle=linear(ctx,cx-s*0.22,0,cx+s*0.22,0,[
    [0,'#2a4a6a'],[0.15,'#5090c0'],[0.5,'#c8e8ff'],[0.85,'#5090c0'],[1,'#2a4a6a']
  ]); ctx.fill();
  // Panel lines
  ctx.strokeStyle='rgba(0,180,255,0.2)'; ctx.lineWidth=W*0.018;
  for(const [ax,ay,bx,by] of[[cx,H*0.26,cx,H*0.72],[cx-s*0.15,H*0.38,cx+s*0.15,H*0.38],[cx-s*0.18,H*0.52,cx+s*0.18,H*0.52]]){
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }
  // Nose
  ctx.beginPath(); ctx.moveTo(cx,H*0.04); ctx.lineTo(cx+s*0.10,H*0.20); ctx.lineTo(cx-s*0.10,H*0.20); ctx.closePath();
  glow(ctx,'#80e8ff',10+ft*8); ctx.fillStyle='#e0f8ff'; ctx.fill(); noGlow(ctx);
  // Cockpit
  ctx.beginPath(); ctx.ellipse(cx,H*0.32,s*0.14,s*0.14,0,0,Math.PI*2);
  glow(ctx,'#00d4ff',14+ft*10);
  ctx.fillStyle=radial(ctx,cx,H*0.28,0,s*0.14,[[0,'#ffffff'],[0.3,'#80f0ff'],[0.7,'#00a8e0'],[1,'#004488']]);
  ctx.fill(); noGlow(ctx);
  ctx.strokeStyle=`rgba(0,220,255,0.5)`; ctx.lineWidth=W*0.022;
  ctx.beginPath(); ctx.ellipse(cx,H*0.32,s*0.14,s*0.14,0,0,Math.PI*2); ctx.stroke();
  // Wing tip lights — pulse with frame
  glow(ctx,'#00ffff',10+tipBright*10);
  ctx.fillStyle=`rgba(0,255,255,${0.5+0.5*tipBright})`;
  for(const dx of[-s*0.82,s*0.82]){
    ctx.beginPath(); ctx.arc(cx+dx,H*0.65,W*0.035,0,Math.PI*2); ctx.fill();
  }
  noGlow(ctx);
}

function drawEngine(ctx,x,y,rx,ry,bright,blur){
  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  ctx.fillStyle=linear(ctx,x-rx,0,x+rx,0,[[0,'#1a2a40'],[0.4,'#2a4a70'],[0.6,'#2a4a70'],[1,'#1a2a40']]);
  ctx.fill();
  ctx.beginPath(); ctx.ellipse(x,y+ry*0.3,rx*0.7,ry*0.4,0,0,Math.PI*2);
  glow(ctx,`rgba(0,${120+bright*80|0},255,1)`,blur);
  ctx.fillStyle=radial(ctx,x,y+ry*0.3,0,rx*0.7,[
    [0,`rgba(${120+bright*100|0},${200+bright*55|0},255,1)`],
    [0.5,`rgba(0,${80+bright*80|0},${200+bright*55|0},1)`],
    [1,'rgba(0,40,120,0)']
  ]); ctx.fill(); noGlow(ctx);
}

// ─── GRUNT (4 frames) ─────────────────────────────────────────────────────────
// 0: neutral  1: eyes bright  2: claws forward  3: eyes+claws combined
function drawGrunt(ctx,W,H,frame,total){
  const cx=W/2,cy=H/2,s=W/2;
  const eyePhase  = [0.3, 1.0, 0.5, 0.9][frame];
  const clawDelta = [0,   0,   3,   3  ][frame] * (Math.PI/180); // claw angle offset

  // Aura
  glow(ctx,'#00ff88',12+eyePhase*10);
  ctx.fillStyle=`rgba(0,255,136,${0.04+eyePhase*0.04})`;
  ctx.beginPath(); ctx.ellipse(cx,cy,s*0.9,H*0.45,0,0,Math.PI*2); ctx.fill();
  noGlow(ctx);

  // Claws
  for(const side of[-1,1]){
    ctx.save(); ctx.translate(cx+side*s*0.32,cy); ctx.rotate(side*clawDelta);
    ctx.beginPath();
    ctx.moveTo(0,-H*0.12); ctx.lineTo(side*s*0.64,-H*0.32+cy*0);
    ctx.lineTo(side*s*0.56,-H*0.10); ctx.lineTo(side*s*0.24,H*0.08);
    ctx.lineTo(0,H*0.16); ctx.closePath();
    ctx.fillStyle=linear(ctx,side<0?-s*0.64:0,0,side<0?0:s*0.64,0,
      side<0?[[0,'#005533'],[0.5,'#00aa66'],[1,'#003322']]
            :[[0,'#003322'],[0.5,'#00aa66'],[1,'#005533']]);
    ctx.fill();
    glow(ctx,'#00ff88',8+clawDelta*30);
    ctx.fillStyle=`rgba(128,255,200,${0.5+clawDelta*5})`;
    ctx.beginPath(); ctx.arc(side*s*0.60,-H*0.28,W*0.04,0,Math.PI*2); ctx.fill();
    noGlow(ctx); ctx.restore();
  }

  // Body
  ctx.beginPath();
  ctx.moveTo(cx,cy-H*0.44); ctx.lineTo(cx+s*0.38,cy-H*0.18);
  ctx.lineTo(cx+s*0.42,cy+H*0.10); ctx.lineTo(cx+s*0.26,cy+H*0.40);
  ctx.lineTo(cx,cy+H*0.46); ctx.lineTo(cx-s*0.26,cy+H*0.40);
  ctx.lineTo(cx-s*0.42,cy+H*0.10); ctx.lineTo(cx-s*0.38,cy-H*0.18);
  ctx.closePath();
  ctx.fillStyle=radial(ctx,cx,cy-H*0.1,0,s*0.7,[
    [0,'#22cc88'],[0.35,'#0e7a50'],[0.7,'#074432'],[1,'#03201a']
  ]); ctx.fill();
  ctx.strokeStyle='rgba(0,255,140,0.18)'; ctx.lineWidth=W*0.025;
  ctx.beginPath(); ctx.moveTo(cx,cy-H*0.44); ctx.lineTo(cx,cy+H*0.46); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-s*0.38,cy+H*0.1); ctx.lineTo(cx+s*0.38,cy+H*0.1); ctx.stroke();

  // Eyes — pulse with eyePhase
  for(const ex of[-s*0.20,s*0.20]){
    ctx.beginPath(); ctx.ellipse(cx+ex,cy-H*0.22,s*0.11,H*0.08,0,0,Math.PI*2);
    glow(ctx,`rgba(255,${30+eyePhase*80|0},0,1)`,10+eyePhase*14);
    const r=Math.min(255,100+eyePhase*155)|0;
    ctx.fillStyle=radial(ctx,cx+ex,cy-H*0.24,0,s*0.11,[
      [0,`rgb(${r},${r*0.5|0},${r*0.3|0})`],[0.4,`rgb(${r},${r*0.1|0},0)`],[1,'#660000']
    ]); ctx.fill(); noGlow(ctx);
    ctx.strokeStyle=`rgba(255,${60+eyePhase*100|0},0,0.6)`; ctx.lineWidth=W*0.02;
    ctx.beginPath(); ctx.ellipse(cx+ex,cy-H*0.22,s*0.11,H*0.08,0,0,Math.PI*2); ctx.stroke();
  }

  // Mandibles
  for(const side of[-1,1]){
    ctx.beginPath();
    ctx.moveTo(cx+side*s*0.12,cy-H*0.40); ctx.lineTo(cx+side*s*0.26,cy-H*0.52);
    ctx.lineTo(cx+side*s*0.16,cy-H*0.36); ctx.closePath();
    ctx.fillStyle='#0a5a38'; ctx.fill();
  }
}

// ─── ALPHA FIGHTER (4 frames) ─────────────────────────────────────────────────
// 0: idle  1: afterburners  2: cannon charge  3: full power
function drawFighter(ctx,W,H,frame,total){
  const cx=W/2,s=W/2;
  const afterburn = [0.4, 1.0, 0.5, 0.9][frame];
  const cannon    = [0.0, 0.2, 1.0, 0.6][frame];

  // Engine glow
  glow(ctx,'#ff6600',14+afterburn*18);
  ctx.fillStyle=`rgba(255,${80+afterburn*40|0},0,${0.4+afterburn*0.3})`;
  ctx.beginPath(); ctx.ellipse(cx,H*0.88,s*0.25,H*0.08+afterburn*H*0.05,0,0,Math.PI*2); ctx.fill();
  noGlow(ctx);

  // Wings
  for(const side of[-1,1]){
    ctx.beginPath();
    ctx.moveTo(cx+side*s*0.18,H*0.18); ctx.lineTo(cx+side*s*0.96,H*0.58);
    ctx.lineTo(cx+side*s*0.96,H*0.70); ctx.lineTo(cx+side*s*0.60,H*0.74);
    ctx.lineTo(cx+side*s*0.28,H*0.58); ctx.lineTo(cx+side*s*0.16,H*0.35);
    ctx.closePath();
    const stops=side<0?[[0,'#3a1a00'],[0.4,'#b84a00'],[0.8,'#e06a00'],[1,'#ff8820']]
                      :[[0,'#ff8820'],[0.2,'#e06a00'],[0.6,'#b84a00'],[1,'#3a1a00']];
    ctx.fillStyle=linear(ctx,side<0?cx-s*0.96:cx,0,side<0?cx:cx+s*0.96,0,stops); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx+side*s*0.18,H*0.18); ctx.lineTo(cx+side*s*0.96,H*0.58);
    ctx.strokeStyle=`rgba(255,${150+afterburn*80|0},60,${0.3+afterburn*0.25})`; ctx.lineWidth=W*0.028; ctx.stroke();
    // Wing cannon
    ctx.beginPath(); ctx.rect(cx+side*(s*0.52)-W*0.025,H*0.55,W*0.05,H*0.12);
    ctx.fillStyle='#2a1a00'; ctx.fill();
    ctx.strokeStyle=`rgba(255,${80+cannon*120|0},0,0.8)`; ctx.lineWidth=W*0.015; ctx.stroke();
    // Cannon tip charge
    if(cannon>0.3){
      glow(ctx,'#ff6600',cannon*14);
      ctx.fillStyle=`rgba(255,${180+cannon*75|0},0,${cannon})`;
      ctx.beginPath(); ctx.arc(cx+side*s*0.54,H*0.56,W*0.025,0,Math.PI*2); ctx.fill();
      noGlow(ctx);
    }
  }

  // Fuselage
  ctx.beginPath();
  ctx.moveTo(cx,H*0.04); ctx.lineTo(cx+s*0.24,H*0.22); ctx.lineTo(cx+s*0.26,H*0.74);
  ctx.lineTo(cx+s*0.18,H*0.88); ctx.lineTo(cx,H*0.84);
  ctx.lineTo(cx-s*0.18,H*0.88); ctx.lineTo(cx-s*0.26,H*0.74); ctx.lineTo(cx-s*0.24,H*0.22);
  ctx.closePath();
  ctx.fillStyle=linear(ctx,cx-s*0.26,0,cx+s*0.26,0,[
    [0,'#2a1000'],[0.2,'#803000'],[0.5,'#cc6600'],[0.8,'#803000'],[1,'#2a1000']
  ]); ctx.fill();
  ctx.strokeStyle='rgba(255,120,0,0.2)'; ctx.lineWidth=W*0.02;
  for(const [ax,ay,bx,by] of[[cx-s*0.2,H*0.32,cx+s*0.2,H*0.32],[cx-s*0.22,H*0.52,cx+s*0.22,H*0.52],[cx,H*0.04,cx,H*0.74]]){
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }

  // Cockpit
  ctx.beginPath();
  ctx.moveTo(cx,H*0.10); ctx.lineTo(cx+s*0.14,H*0.26); ctx.lineTo(cx+s*0.10,H*0.38);
  ctx.lineTo(cx-s*0.10,H*0.38); ctx.lineTo(cx-s*0.14,H*0.26); ctx.closePath();
  glow(ctx,'#ff6600',12+cannon*10);
  const cockpitR=Math.min(255,200+afterburn*55)|0;
  ctx.fillStyle=radial(ctx,cx,H*0.24,0,s*0.14,[
    [0,`rgb(255,${220+afterburn*35|0},${100+afterburn*60|0})`],
    [0.3,`rgb(${cockpitR},${80+afterburn*80|0},0)`],
    [0.7,'#cc4400'],[1,'#440000']
  ]); ctx.fill(); noGlow(ctx);

  // Nose cannon
  ctx.beginPath(); ctx.rect(cx-W*0.03,H*0.00,W*0.06,H*0.12); ctx.fillStyle='#1a0a00'; ctx.fill();
  glow(ctx,'#ff8800',6+cannon*14);
  ctx.fillStyle=`rgba(255,${100+cannon*155|0},0,${0.6+cannon*0.4})`;
  ctx.beginPath(); ctx.arc(cx,H*0.01,W*0.025,0,Math.PI*2); ctx.fill(); noGlow(ctx);

  // Afterburners
  for(const dx of[-s*0.92,s*0.92]){
    glow(ctx,'#ff4400',8+afterburn*14);
    ctx.fillStyle=`rgba(255,${60+afterburn*60|0},0,${0.5+afterburn*0.5})`;
    ctx.beginPath(); ctx.arc(cx+dx,H*0.64,W*(0.028+afterburn*0.018),0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgba(255,${180+afterburn*75|0},${afterburn*100|0},${afterburn})`;
    ctx.beginPath(); ctx.arc(cx+dx,H*0.64,W*0.012,0,Math.PI*2); ctx.fill();
    noGlow(ctx);
  }
}

// ─── COMMANDER (4 frames) ─────────────────────────────────────────────────────
// 0: idle  1: core brightest  2: left pod fires  3: right pod fires
function drawCommander(ctx,W,H,frame,total){
  const cx=W/2,cy=H/2,s=W/2;
  const corePulse = [0.5, 1.0, 0.6, 0.7][frame];
  const leftFire  = [0.2, 0.3, 1.0, 0.1][frame];
  const rightFire = [0.2, 0.3, 0.1, 1.0][frame];
  const podFire   = [leftFire, rightFire];

  // Aura
  glow(ctx,'#8800ff',18+corePulse*16);
  ctx.fillStyle=`rgba(120,0,255,${0.04+corePulse*0.04})`;
  ctx.beginPath(); ctx.ellipse(cx,cy,s*0.95,H*0.46,0,0,Math.PI*2); ctx.fill(); noGlow(ctx);

  // Weapon pods + struts
  [[-1,leftFire],[1,rightFire]].forEach(([side,fire],pi)=>{
    const px=cx+side*s*0.75,py=cy+H*0.02;
    // Strut
    const strutW=s*(0.75-0.30);
    ctx.beginPath();
    ctx.rect(cx+side*s*0.30,cy-H*0.04,side*strutW,H*0.08);
    ctx.fillStyle=linear(ctx,cx,0,cx+side*s*0.75,0,[[0,'#3a1a60'],[1,'#5a2a90']]); ctx.fill();
    // Pod body
    ctx.beginPath();
    ctx.moveTo(px+side*W*0.04,py-H*0.26); ctx.lineTo(px+side*W*0.14,py-H*0.10);
    ctx.lineTo(px+side*W*0.14,py+H*0.24); ctx.lineTo(px-side*W*0.02,py+H*0.30);
    ctx.lineTo(px-side*W*0.08,py+H*0.10); ctx.lineTo(px-side*W*0.10,py-H*0.20);
    ctx.closePath();
    ctx.fillStyle=radial(ctx,px,py,0,s*0.3,[
      [0,`rgba(${100+fire*88|0},${40+fire*20|0},${180+fire*60|0},1)`],
      [0.5,'#4a1a88'],[1,'#1a0838']
    ]); ctx.fill();
    ctx.strokeStyle=`rgba(180,100,255,${0.25+fire*0.4})`; ctx.lineWidth=W*0.02; ctx.stroke();
    // Pod eye
    glow(ctx,`rgba(${150+fire*105|0},${40+fire*80|0},255,1)`,10+fire*14);
    ctx.fillStyle=radial(ctx,px,py-H*0.08,0,s*0.12,[
      [0,'#ffffff'],[0.3,`rgba(${200+fire*55|0},${80+fire*120|0},255,1)`],
      [0.7,`rgba(${80+fire*80|0},0,${150+fire*105|0},1)`],[1,'#220044']
    ]);
    ctx.beginPath(); ctx.ellipse(px,py-H*0.08,s*0.12,H*0.07,0,0,Math.PI*2); ctx.fill();
    noGlow(ctx);
    // Cannon barrels + muzzle flash
    for(let b=-1;b<=1;b+=2){
      const bx=px+side*W*0.02+b*W*0.025;
      ctx.beginPath(); ctx.rect(bx-W*0.015,py+H*0.20,W*0.03,H*0.12);
      ctx.fillStyle='#10042a'; ctx.fill();
      ctx.strokeStyle=`rgba(${80+fire*130|0},${20+fire*60|0},${160+fire*95|0},0.8)`; ctx.lineWidth=W*0.012; ctx.stroke();
      if(fire>0.7){
        glow(ctx,'#cc44ff',fire*16);
        ctx.fillStyle=`rgba(220,${100+fire*80|0},255,${fire})`;
        ctx.beginPath(); ctx.arc(bx,py+H*0.32,W*0.025,0,Math.PI*2); ctx.fill();
        noGlow(ctx);
      }
    }
  });

  // Hull
  ctx.beginPath();
  ctx.moveTo(cx,H*0.04); ctx.lineTo(cx+s*0.36,H*0.18); ctx.lineTo(cx+s*0.40,H*0.44);
  ctx.lineTo(cx+s*0.32,H*0.78); ctx.lineTo(cx+s*0.18,H*0.90); ctx.lineTo(cx,H*0.88);
  ctx.lineTo(cx-s*0.18,H*0.90); ctx.lineTo(cx-s*0.32,H*0.78); ctx.lineTo(cx-s*0.40,H*0.44);
  ctx.lineTo(cx-s*0.36,H*0.18); ctx.closePath();
  ctx.fillStyle=linear(ctx,cx-s*0.40,0,cx+s*0.40,0,[
    [0,'#1a0438'],[0.2,'#4a1480'],[0.5,'#8030c0'],[0.8,'#4a1480'],[1,'#1a0438']
  ]); ctx.fill();
  ctx.strokeStyle='rgba(180,80,255,0.2)'; ctx.lineWidth=W*0.02;
  for(const [ax,ay,bx,by] of[[cx,H*0.04,cx,H*0.88],[cx-s*0.32,H*0.35,cx+s*0.32,H*0.35],[cx-s*0.34,H*0.55,cx+s*0.34,H*0.55]]){
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }

  // Energy core
  ctx.beginPath(); ctx.ellipse(cx,cy+H*0.04,s*0.18,H*0.14,0,0,Math.PI*2);
  glow(ctx,`rgba(${150+corePulse*105|0},0,255,1)`,14+corePulse*18);
  ctx.fillStyle=radial(ctx,cx,cy,0,s*0.18,[
    [0,'#ffffff'],[0.2,`rgba(${200+corePulse*55|0},${100+corePulse*60|0},255,1)`],
    [0.5,`rgba(${100+corePulse*80|0},0,${180+corePulse*75|0},1)`],[0.8,'#4400aa'],[1,'#110022']
  ]); ctx.fill(); noGlow(ctx);
  ctx.strokeStyle=`rgba(220,120,255,${0.4+corePulse*0.3})`; ctx.lineWidth=W*0.025;
  ctx.beginPath(); ctx.ellipse(cx,cy+H*0.04,s*0.18,H*0.14,0,0,Math.PI*2); ctx.stroke();

  // Bridge
  ctx.beginPath();
  ctx.moveTo(cx,H*0.08); ctx.lineTo(cx+s*0.20,H*0.20); ctx.lineTo(cx+s*0.16,H*0.32);
  ctx.lineTo(cx-s*0.16,H*0.32); ctx.lineTo(cx-s*0.20,H*0.20); ctx.closePath();
  glow(ctx,'#cc44ff',10+corePulse*8);
  ctx.fillStyle=radial(ctx,cx,H*0.18,0,s*0.2,[
    [0,'#f0ccff'],[0.3,`rgba(${180+corePulse*75|0},${60+corePulse*80|0},255,1)`],[0.7,'#6600cc'],[1,'#220044']
  ]); ctx.fill(); noGlow(ctx);
  // Crown spines
  for(let i=-1;i<=1;i++){
    const bx=cx+i*s*0.16;
    ctx.beginPath(); ctx.moveTo(bx-W*0.02,H*0.10); ctx.lineTo(bx,H*0.02); ctx.lineTo(bx+W*0.02,H*0.10); ctx.closePath();
    glow(ctx,'#cc44ff',6+corePulse*8); ctx.fillStyle=`rgba(${180+corePulse*75|0},${80+corePulse*100|0},255,1)`; ctx.fill(); noGlow(ctx);
  }
}

// ─── BOSS — IRON HYDRA (4 frames) ────────────────────────────────────────────
// 0: idle  1: left head opens  2: center head + core max  3: all heads + cannon barrage
function drawBoss(ctx,W,H,frame,total){
  const cx=W/2,cy=H/2,s=W/2;
  const corePhase  = [0.5, 0.7, 1.0, 0.8][frame];
  const jawOpen    = [[0,0,0],[1,0,0],[0,1,0],[1,1,1]][frame]; // per head
  const cannonFire = [0.2, 0.4, 0.6, 1.0][frame];

  // Aura
  glow(ctx,'#ff0000',24+corePhase*20);
  ctx.fillStyle=`rgba(255,0,0,${0.03+corePhase*0.04})`;
  ctx.beginPath(); ctx.ellipse(cx,cy,s*0.96,H*0.48,0,0,Math.PI*2); ctx.fill(); noGlow(ctx);

  // Shoulder cannon banks
  for(const side of[-1,1]){
    ctx.beginPath();
    ctx.moveTo(cx+side*s*0.44,H*0.18); ctx.lineTo(cx+side*s*0.96,H*0.28);
    ctx.lineTo(cx+side*s*0.96,H*0.44); ctx.lineTo(cx+side*s*0.80,H*0.52);
    ctx.lineTo(cx+side*s*0.48,H*0.46); ctx.lineTo(cx+side*s*0.38,H*0.30);
    ctx.closePath();
    ctx.fillStyle=radial(ctx,cx+side*s*0.68,H*0.36,0,s*0.4,[
      [0,`rgba(${80+cannonFire*60|0},${15+cannonFire*10|0},${15+cannonFire*10|0},1)`],
      [0.5,'#3a0808'],[1,'#150202']
    ]); ctx.fill();
    ctx.strokeStyle=`rgba(255,${40+cannonFire*60|0},0,${0.2+cannonFire*0.2})`; ctx.lineWidth=W*0.012; ctx.stroke();
    for(let b=0;b<3;b++){
      const bx=cx+side*(s*0.64+b*W*0.07);
      ctx.beginPath(); ctx.rect(bx-W*0.018,H*0.52,W*0.036,H*0.10);
      ctx.fillStyle='#0e0202'; ctx.fill();
      ctx.strokeStyle='#882200'; ctx.lineWidth=W*0.008; ctx.stroke();
      const cf=cannonFire*(b===frame%3?1:0.4);
      glow(ctx,'#ff3300',6+cf*14);
      ctx.fillStyle=`rgba(255,${40+cf*120|0},0,${0.4+cf*0.6})`;
      ctx.beginPath(); ctx.arc(bx,H*0.62,W*(0.016+cf*0.012),0,Math.PI*2); ctx.fill();
      noGlow(ctx);
    }
  }

  // Three hydra heads
  const headDefs=[
    {x:cx-s*0.42,y:H*0.08,tilt:-0.18,jaw:jawOpen[0]},
    {x:cx,       y:H*0.04,tilt: 0.00,jaw:jawOpen[1]},
    {x:cx+s*0.42,y:H*0.08,tilt: 0.18,jaw:jawOpen[2]},
  ];
  headDefs.forEach(h=>{
    ctx.save(); ctx.translate(h.x,h.y); ctx.rotate(h.tilt);
    drawHydraHead(ctx,W,H,h.jaw); ctx.restore();
  });

  // Central body
  ctx.beginPath();
  ctx.moveTo(cx,H*0.18); ctx.lineTo(cx+s*0.46,H*0.26); ctx.lineTo(cx+s*0.50,H*0.56);
  ctx.lineTo(cx+s*0.42,H*0.78); ctx.lineTo(cx+s*0.24,H*0.90); ctx.lineTo(cx,H*0.92);
  ctx.lineTo(cx-s*0.24,H*0.90); ctx.lineTo(cx-s*0.42,H*0.78); ctx.lineTo(cx-s*0.50,H*0.56);
  ctx.lineTo(cx-s*0.46,H*0.26); ctx.closePath();
  ctx.fillStyle=radial(ctx,cx,cy,0,s*0.5,[
    [0,`rgba(${60+corePhase*40|0},${15+corePhase*15|0},${15+corePhase*15|0},1)`],
    [0.3,'#3a0e0e'],[0.6,'#220808'],[1,'#0e0202']
  ]); ctx.fill();
  ctx.strokeStyle=`rgba(255,${40+corePhase*40|0},0,0.15)`; ctx.lineWidth=W*0.01;
  for(const y of[0.34,0.46,0.58,0.70]){
    const hw=s*(0.46-0.12*(y-0.26));
    ctx.beginPath(); ctx.moveTo(cx-hw,H*y); ctx.lineTo(cx+hw,H*y); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(cx,H*0.18); ctx.lineTo(cx,H*0.92); ctx.stroke();

  // Reactor core — pulses
  ctx.beginPath(); ctx.ellipse(cx,cy+H*0.06,s*0.20,H*0.12,0,0,Math.PI*2);
  glow(ctx,'#ff2200',18+corePhase*22);
  ctx.fillStyle=radial(ctx,cx,cy+H*0.02,0,s*0.20,[
    [0,'#ffffff'],[0.15,`rgba(255,${180+corePhase*75|0},0,1)`],
    [0.4,`rgba(255,${40+corePhase*60|0},0,1)`],[0.7,'#aa0000'],[1,'#330000']
  ]); ctx.fill(); noGlow(ctx);
  ctx.strokeStyle=`rgba(255,${80+corePhase*80|0},0,${0.5+corePhase*0.3})`; ctx.lineWidth=W*0.018;
  ctx.beginPath(); ctx.ellipse(cx,cy+H*0.06,s*0.20,H*0.12,0,0,Math.PI*2); ctx.stroke();
  // Rotating ring (shifts position per frame)
  const ringRot = frame * Math.PI * 0.25;
  ctx.strokeStyle=`rgba(255,${150+corePhase*60|0},0,${0.25+corePhase*0.15})`;
  ctx.lineWidth=W*0.012; ctx.setLineDash([W*0.04,W*0.03]);
  ctx.save(); ctx.translate(cx,cy+H*0.06); ctx.rotate(ringRot);
  ctx.beginPath(); ctx.ellipse(0,0,s*0.28,H*0.17,0,0,Math.PI*2); ctx.stroke();
  ctx.restore(); ctx.setLineDash([]);

  // Bottom weapon cluster
  for(let i=-1;i<=1;i++){
    const bx=cx+i*s*0.26;
    ctx.beginPath(); ctx.moveTo(bx-W*0.03,H*0.86); ctx.lineTo(bx+W*0.03,H*0.86);
    ctx.lineTo(bx+W*0.025,H*0.96); ctx.lineTo(bx-W*0.025,H*0.96); ctx.closePath();
    ctx.fillStyle='#0e0202'; ctx.fill();
    ctx.strokeStyle='#aa2200'; ctx.lineWidth=W*0.008; ctx.stroke();
    const cf = cannonFire * (i===[-1,0,1][frame%3]?1:0.3);
    glow(ctx,'#ff3300',6+cf*12);
    ctx.fillStyle=`rgba(255,${40+cf*100|0},0,${0.4+cf*0.6})`;
    ctx.beginPath(); ctx.arc(bx,H*0.95,W*(0.018+cf*0.01),0,Math.PI*2); ctx.fill();
    noGlow(ctx);
  }
}

function drawHydraHead(ctx,W,H,jawOpen){
  const jawAngle = jawOpen * 0.25;  // radians
  // Neck
  ctx.beginPath(); ctx.rect(-W*0.06,0,W*0.12,H*0.10);
  ctx.fillStyle='#3a0808'; ctx.fill();
  // Upper jaw
  ctx.save(); ctx.rotate(-jawAngle);
  ctx.beginPath();
  ctx.moveTo(0,-H*0.14); ctx.lineTo(W*0.10,-H*0.04); ctx.lineTo(W*0.10,H*0.00);
  ctx.lineTo(0,H*0.00); ctx.closePath();
  ctx.fillStyle=radial(ctx,0,-H*0.07,0,W*0.12,[[0,'#cc2200'],[0.5,'#880800'],[1,'#2a0200']]);
  ctx.fill(); ctx.strokeStyle='rgba(255,80,0,0.35)'; ctx.lineWidth=W*0.015; ctx.stroke();
  // Upper fang
  ctx.beginPath(); ctx.moveTo(W*0.05,-H*0.01); ctx.lineTo(W*0.07,-H*0.07); ctx.lineTo(W*0.03,-H*0.07); ctx.closePath();
  ctx.fillStyle='#ddaaaa'; ctx.fill(); ctx.restore();
  // Lower jaw
  ctx.save(); ctx.rotate(jawAngle);
  ctx.beginPath();
  ctx.moveTo(-W*0.10,-H*0.04); ctx.lineTo(-W*0.10,H*0.00);
  ctx.lineTo(0,H*0.00); ctx.lineTo(0,-H*0.06); ctx.closePath();
  ctx.fillStyle=radial(ctx,0,-H*0.03,0,W*0.10,[[0,'#aa1a00'],[0.5,'#660600'],[1,'#1e0000']]);
  ctx.fill(); ctx.restore();
  // Eye
  glow(ctx,`rgba(255,${80+jawOpen*80|0},0,1)`,8+jawOpen*12);
  ctx.fillStyle=radial(ctx,0,-H*0.08,0,W*0.05,[
    [0,`rgba(255,${180+jawOpen*75|0},0,1)`],[0.4,'#ff4400'],[1,'#440000']
  ]);
  ctx.beginPath(); ctx.ellipse(0,-H*0.08,W*0.05,H*0.03,0,0,Math.PI*2); ctx.fill();
  noGlow(ctx);
  // Tongue (only when jaw open)
  if(jawOpen>0.3){
    ctx.strokeStyle=`rgba(255,${50+jawOpen*60|0},${50+jawOpen*60|0},${jawOpen})`;
    ctx.lineWidth=W*0.02;
    ctx.beginPath(); ctx.moveTo(0,-H*0.02); ctx.lineTo(0,-H*0.08-jawOpen*H*0.04); ctx.stroke();
  }
}

// ─── BULLETS ─────────────────────────────────────────────────────────────────
function drawBulletPlayer(ctx,W,H,frame){
  const cx=W/2; const bright=frame===0?1:0.7;
  glow(ctx,'#00d4ff',10+bright*6);
  ctx.fillStyle=linear(ctx,0,0,0,H,[[0,'#80f0ff'],[0.5,'#00aaff'],[1,'#0044aa']]);
  ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(W*0.85,H*0.15); ctx.lineTo(W*0.75,H);
  ctx.lineTo(W*0.25,H); ctx.lineTo(W*0.15,H*0.15); ctx.closePath(); ctx.fill();
  ctx.fillStyle=`rgba(255,255,255,${bright})`; ctx.beginPath(); ctx.rect(cx-W*0.12,H*0.2,W*0.24,H*0.6); ctx.fill();
  noGlow(ctx);
}
function drawBulletEnemy(ctx,W,H,frame){
  const cx=W/2,cy=H/2; const b=frame===0?1:0.6;
  glow(ctx,'#ff4400',8+b*8);
  ctx.fillStyle=radial(ctx,cx,cy,0,W*0.5,[[0,`rgba(255,${180+b*75|0},${b*80|0},1)`],[0.5,'#cc2200'],[1,'#440000']]);
  ctx.beginPath(); ctx.ellipse(cx,cy,W*0.4,H*0.48,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=`rgba(255,${200+b*55|0},${b*100|0},${b})`; ctx.beginPath(); ctx.ellipse(cx,cy+H*0.08,W*0.18,H*0.22,0,0,Math.PI*2); ctx.fill();
  noGlow(ctx);
}
function drawBulletRed(ctx,W,H,frame){
  const cx=W/2,cy=H/2; const b=frame===0?1:0.6;
  glow(ctx,'#ff0044',8+b*8);
  ctx.fillStyle=radial(ctx,cx,cy,0,W*0.5,[[0,`rgba(255,${80+b*80|0},${100+b*80|0},1)`],[0.5,'#cc0033'],[1,'#440010']]);
  ctx.beginPath(); ctx.ellipse(cx,cy,W*0.4,H*0.48,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=`rgba(255,${180+b*75|0},${180+b*75|0},${b})`; ctx.beginPath(); ctx.ellipse(cx,cy+H*0.08,W*0.18,H*0.22,0,0,Math.PI*2); ctx.fill();
  noGlow(ctx);
}
function drawBulletBoss(ctx,W,H,frame){
  const cx=W/2,cy=H/2;
  const phases=[[0.7,0.4],[1.0,0.7],[0.5,1.0]];
  const [inner,outer]=phases[frame]||phases[0];
  glow(ctx,'#ff6600',12+outer*12);
  ctx.fillStyle=radial(ctx,cx,cy,0,W*0.5,[[0,`rgba(255,${200+outer*55|0},0,1)`],[0.3,`rgba(255,${60+outer*80|0},0,1)`],[0.7,'#880000'],[1,'#220000']]);
  ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx+W*0.45,cy); ctx.lineTo(cx,H); ctx.lineTo(cx-W*0.45,cy); ctx.closePath(); ctx.fill();
  ctx.fillStyle=`rgba(255,255,${inner*180|0},${inner})`; ctx.beginPath(); ctx.arc(cx,cy,W*0.15,0,Math.PI*2); ctx.fill();
  noGlow(ctx);
}

// ─── Card builder ─────────────────────────────────────────────────────────────
const previewStates = {}; // id -> { frame, interval }

function buildCard(sp){
  const sc=scale();
  const card=document.createElement('div');
  card.className='sprite-card';
  card.id='card_'+sp.id;

  // Header
  const header=document.createElement('div');
  header.className='card-header';
  header.innerHTML=`<h2>${sp.label}</h2><span class="tag">${sp.w}×${sp.h}pt · ${sp.frames} frames · ${sp.w*sc}×${sp.h*sc}px@${sc}×</span>`;
  card.appendChild(header);

  // Frames row
  const framesRow=document.createElement('div');
  framesRow.className='frames-row';

  for(let f=0;f<sp.frames;f++){
    const wrap=document.createElement('div');
    wrap.className='frame-wrap';
    const lbl=document.createElement('div');
    lbl.className='frame-label';
    lbl.textContent=`f${f}`;
    const cvs=document.createElement('canvas');
    const displayMax=90;
    const displayScale=Math.max(1,Math.floor(displayMax/Math.max(sp.w,sp.h)));
    cvs.width=sp.w*sc; cvs.height=sp.h*sc;
    cvs.style.width=(sp.w*displayScale)+'px';
    cvs.style.height=(sp.h*displayScale)+'px';
    cvs.className='sprite';
    cvs.id=`cvs_${sp.id}_${f}`;
    cvs.title=`Click to export ${sp.id}_${f}.png`;
    cvs.onclick=()=>exportFrame(sp,f,cvs);
    wrap.appendChild(lbl);
    wrap.appendChild(cvs);
    framesRow.appendChild(wrap);
    renderFrame(sp,cvs,f,sc);
  }

  // Live preview canvas
  const previewWrap=document.createElement('div');
  previewWrap.className='frame-wrap';
  const previewLbl=document.createElement('div');
  previewLbl.className='frame-label';
  previewLbl.textContent='preview';
  const previewCvs=document.createElement('canvas');
  const prevMax=110;
  const prevScale=Math.max(1,Math.floor(prevMax/Math.max(sp.w,sp.h)));
  previewCvs.width=sp.w*sc; previewCvs.height=sp.h*sc;
  previewCvs.style.width=(sp.w*prevScale)+'px';
  previewCvs.style.height=(sp.h*prevScale)+'px';
  previewCvs.className='anim-preview';
  previewCvs.id=`preview_${sp.id}`;
  previewWrap.appendChild(previewLbl);
  previewWrap.appendChild(previewCvs);
  framesRow.appendChild(previewWrap);
  card.appendChild(framesRow);

  // Actions
  const actions=document.createElement('div');
  actions.className='card-actions';
  const playBtn=document.createElement('button');
  playBtn.className='btn green';
  playBtn.textContent='▶ Play';
  playBtn.id=`playbtn_${sp.id}`;
  playBtn.onclick=()=>togglePreview(sp,previewCvs,sc,playBtn);
  actions.appendChild(playBtn);

  const exportBtn=document.createElement('button');
  exportBtn.className='btn';
  exportBtn.textContent='⬇ Export All Frames';
  exportBtn.onclick=()=>{ for(let f=0;f<sp.frames;f++){ const c=document.getElementById(`cvs_${sp.id}_${f}`); if(c)exportFrame(sp,f,c); } };
  actions.appendChild(exportBtn);

  const fpsLbl=document.createElement('span');
  fpsLbl.className='fps-label';
  fpsLbl.textContent=`@ ${fps()} fps`;
  fpsLbl.id=`fpslbl_${sp.id}`;
  actions.appendChild(fpsLbl);
  card.appendChild(actions);
  document.getElementById('grid').appendChild(card);

  // Auto-start preview
  togglePreview(sp,previewCvs,sc,playBtn);
}

function renderFrame(sp,cvs,frame,sc){
  const ctx=cvs.getContext('2d');
  ctx.clearRect(0,0,cvs.width,cvs.height);
  sp.draw(ctx,cvs.width,cvs.height,frame,sp.frames);
}

function togglePreview(sp,cvs,sc,btn){
  if(previewStates[sp.id]){
    clearInterval(previewStates[sp.id].interval);
    delete previewStates[sp.id];
    btn.textContent='▶ Play';
    return;
  }
  let f=0;
  const interval=setInterval(()=>{
    renderFrame(sp,cvs,f,sc);
    // Highlight current frame
    for(let i=0;i<sp.frames;i++){
      const c=document.getElementById(`cvs_${sp.id}_${i}`);
      if(c) c.classList.toggle('frame-active',i===f);
    }
    document.getElementById(`fpslbl_${sp.id}`).textContent=`@ ${fps()} fps`;
    f=(f+1)%sp.frames;
  },1000/fps());
  previewStates[sp.id]={interval,f};
  btn.textContent='■ Stop';
}

function stopAllPreviews(){
  Object.keys(previewStates).forEach(id=>{
    clearInterval(previewStates[id].interval);
    delete previewStates[id];
    const btn=document.getElementById(`playbtn_${id}`);
    if(btn) btn.textContent='▶ Play';
  });
}

function exportFrame(sp,frame,cvs){
  const a=document.createElement('a');
  a.download=`${sp.id}_${frame}.png`;
  a.href=cvs.toDataURL('image/png');
  a.click();
}

function exportAll(){
  const sc=scale();
  SPRITES.forEach(sp=>{
    for(let f=0;f<sp.frames;f++){
      const cvs=document.getElementById(`cvs_${sp.id}_${f}`);
      if(cvs) exportFrame(sp,f,cvs);
    }
  });
}

function redrawAll(){
  stopAllPreviews();
  const sc=scale();
  document.getElementById('grid').innerHTML='';
  SPRITES.forEach(sp=>buildCard(sp));
}

// ─── PARTICLE TEXTURES ────────────────────────────────────────────────────────
// These are single-frame textures used by SKEmitterNode as particleTexture.
const PARTICLES = [
  { id:'spark',           label:'Spark',             w:8,  h:8,  draw:drawSpark         },
  { id:'smoke_puff',      label:'Smoke Puff',        w:16, h:16, draw:drawSmokePuff     },
  { id:'ember',           label:'Ember',             w:6,  h:6,  draw:drawEmber         },
  { id:'ring_shockwave',  label:'Ring / Shockwave',  w:32, h:32, draw:drawRingShockwave },
  { id:'debris',          label:'Debris Chip',       w:8,  h:6,  draw:drawDebris        },
  { id:'glow_orb',        label:'Glow Orb',          w:16, h:16, draw:drawGlowOrb       },
  { id:'star_particle',   label:'Star Particle',     w:8,  h:8,  draw:drawStarParticle  },
  { id:'energy_trail',    label:'Energy Trail',      w:4,  h:12, draw:drawEnergyTrail   },
];

// ─── EXPLOSION ANIMATIONS ─────────────────────────────────────────────────────
const EXPLOSIONS = [
  { id:'explosion_enemy', label:'Enemy Explosion',  w:48, h:48, frames:6, draw:drawEnemyExplosion },
  { id:'explosion_player',label:'Player Explosion', w:64, h:64, frames:8, draw:drawPlayerExplosion},
  { id:'explosion_boss',  label:'Boss Explosion',   w:96, h:96, frames:8, draw:drawBossExplosion  },
];

function drawSpark(ctx,W,H){
  const cx=W/2,cy=H/2;
  glow(ctx,'#ffcc00',W*0.8);
  ctx.fillStyle=radial(ctx,cx,cy,0,W*0.5,[[0,'#ffffff'],[0.3,'#ffee88'],[0.7,'#ff8800'],[1,'transparent']]);
  ctx.beginPath(); ctx.arc(cx,cy,W*0.45,0,Math.PI*2); ctx.fill(); noGlow(ctx);
}

function drawSmokePuff(ctx,W,H){
  const cx=W/2,cy=H/2;
  ctx.fillStyle=radial(ctx,cx,cy,0,W*0.5,[[0,'rgba(160,160,160,0.6)'],[0.5,'rgba(80,80,90,0.35)'],[1,'transparent']]);
  ctx.beginPath(); ctx.arc(cx,cy,W*0.48,0,Math.PI*2); ctx.fill();
  // Wispy edges
  for(let i=0;i<3;i++){
    const a=i*Math.PI*2/3, r=W*0.3;
    ctx.fillStyle=radial(ctx,cx+Math.cos(a)*r,cy+Math.sin(a)*r,0,W*0.25,
      [[0,'rgba(120,120,130,0.4)'],[1,'transparent']]);
    ctx.beginPath(); ctx.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,W*0.25,0,Math.PI*2); ctx.fill();
  }
}

function drawEmber(ctx,W,H){
  const cx=W/2,cy=H/2;
  glow(ctx,'#ff4400',W*1.2);
  ctx.fillStyle=radial(ctx,cx,cy,0,W*0.5,[[0,'#ffffff'],[0.2,'#ffdd88'],[0.6,'#ff4400'],[1,'transparent']]);
  ctx.beginPath(); ctx.arc(cx,cy,W*0.45,0,Math.PI*2); ctx.fill(); noGlow(ctx);
}

function drawRingShockwave(ctx,W,H){
  const cx=W/2,cy=H/2;
  glow(ctx,'#88ccff',4);
  ctx.strokeStyle=radial(ctx,cx,cy,W*0.3,W*0.5,[[0,'rgba(200,240,255,0.9)'],[0.5,'rgba(80,160,255,0.5)'],[1,'transparent']]);
  ctx.lineWidth=W*0.12;
  ctx.beginPath(); ctx.arc(cx,cy,W*0.38,0,Math.PI*2); ctx.stroke(); noGlow(ctx);
}

function drawDebris(ctx,W,H){
  ctx.save(); ctx.translate(W*0.5,H*0.5); ctx.rotate(Math.PI*0.3);
  ctx.fillStyle=linear(ctx,-W*0.5,0,W*0.5,0,[[0,'#3a3a4a'],[0.5,'#8888a0'],[1,'#2a2a3a']]);
  ctx.beginPath();
  ctx.moveTo(-W*0.45,-H*0.25); ctx.lineTo(W*0.45,-H*0.1);
  ctx.lineTo(W*0.3,H*0.3); ctx.lineTo(-W*0.35,H*0.15); ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='rgba(180,180,220,0.3)'; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
}

function drawGlowOrb(ctx,W,H){
  const cx=W/2,cy=H/2;
  glow(ctx,'#44aaff',W*0.6);
  ctx.fillStyle=radial(ctx,cx,cy,0,W*0.5,[[0,'#ffffff'],[0.2,'#aaddff'],[0.6,'#2266cc'],[1,'transparent']]);
  ctx.beginPath(); ctx.arc(cx,cy,W*0.48,0,Math.PI*2); ctx.fill(); noGlow(ctx);
}

function drawStarParticle(ctx,W,H){
  const cx=W/2,cy=H/2;
  glow(ctx,'#ffffff',W*0.5);
  ctx.fillStyle='#ffffff';
  // 4-point star
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4, r=i%2===0?W*0.44:W*0.18;
    i===0?ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)
         :ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
  }
  ctx.closePath(); ctx.fill(); noGlow(ctx);
}

function drawEnergyTrail(ctx,W,H){
  const cx=W/2;
  glow(ctx,'#00aaff',W*1.5);
  ctx.fillStyle=linear(ctx,0,0,0,H,[[0,'transparent'],[0.2,'rgba(0,200,255,0.8)'],[0.8,'rgba(0,80,200,0.4)'],[1,'transparent']]);
  ctx.beginPath();
  ctx.moveTo(cx,0); ctx.lineTo(W,H*0.25); ctx.lineTo(W*0.75,H); ctx.lineTo(W*0.25,H); ctx.lineTo(0,H*0.25);
  ctx.closePath(); ctx.fill(); noGlow(ctx);
}

// ─── EXPLOSION FRAMES ─────────────────────────────────────────────────────────
// t = frame/(total-1), 0=start, 1=end

function drawEnemyExplosion(ctx,W,H,frame,total){
  const cx=W/2,cy=H/2;
  const t=frame/(total-1);
  const maxR=W*0.48;
  const r=t*maxR;
  const alpha=1-t;

  // Outer shockwave ring — expands and fades
  if(t>0.05){
    ctx.strokeStyle=`rgba(255,${180-t*80|0},${60-t*60|0},${alpha*0.8})`;
    ctx.lineWidth=W*(0.06*(1-t)+0.01);
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  }
  // Inner fireball
  const fbR=maxR*(t<0.4?t/0.4:1-t)*0.9;
  if(fbR>0){
    glow(ctx,`rgba(255,${120-t*80|0},0,1)`,fbR*0.6);
    ctx.fillStyle=radial(ctx,cx,cy,0,fbR,[
      [0,'#ffffff'],
      [0.2,`rgba(255,${220-t*100|0},${100-t*100|0},1)`],
      [0.6,`rgba(255,${80-t*80|0},0,${1-t*0.5})`],
      [1,'transparent']
    ]);
    ctx.beginPath(); ctx.arc(cx,cy,fbR,0,Math.PI*2); ctx.fill(); noGlow(ctx);
  }
  // Debris sparks — appear mid-explosion
  if(t>0.2 && t<0.85){
    const count=6;
    for(let i=0;i<count;i++){
      const a=(i/count)*Math.PI*2+(t*Math.PI*0.5);
      const dr=r*(0.4+((i*0.17)%0.5));
      const sz=W*(0.04*(1-(t-0.2)/0.65));
      ctx.fillStyle=`rgba(255,${160+i*10|0},0,${(1-(t-0.2)/0.65)*0.9})`;
      ctx.beginPath(); ctx.arc(cx+Math.cos(a)*dr,cy+Math.sin(a)*dr,sz,0,Math.PI*2); ctx.fill();
    }
  }
  // Smoke — late frames
  if(t>0.6){
    const smokeAlpha=(t-0.6)/0.4*0.35;
    ctx.fillStyle=`rgba(80,80,90,${smokeAlpha})`;
    ctx.beginPath(); ctx.arc(cx,cy-r*0.2,r*0.55,0,Math.PI*2); ctx.fill();
  }
}

function drawPlayerExplosion(ctx,W,H,frame,total){
  const cx=W/2,cy=H/2;
  const t=frame/(total-1);
  const maxR=W*0.48;
  const r=t*maxR;

  // Outer cyan shockwave
  if(t>0.05){
    ctx.strokeStyle=`rgba(0,${180+t*75|0},255,${(1-t)*0.9})`;
    ctx.lineWidth=W*(0.08*(1-t)+0.01);
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
    // Second ring slightly behind
    if(t>0.2){
      ctx.strokeStyle=`rgba(0,120,255,${(1-t)*0.4})`;
      ctx.lineWidth=W*0.03;
      ctx.beginPath(); ctx.arc(cx,cy,r*0.7,0,Math.PI*2); ctx.stroke();
    }
  }
  // Bright white core flash (early frames)
  const coreR=maxR*(t<0.3?t/0.3:1-t)*0.85;
  if(coreR>0){
    glow(ctx,'#00d4ff',coreR*0.8);
    ctx.fillStyle=radial(ctx,cx,cy,0,coreR,[
      [0,'#ffffff'],[0.2,'#aaeeff'],[0.6,`rgba(0,${100+t*155|0},255,${1-t})`],[1,'transparent']
    ]);
    ctx.beginPath(); ctx.arc(cx,cy,coreR,0,Math.PI*2); ctx.fill(); noGlow(ctx);
  }
  // Cyan energy sparks
  if(t>0.15 && t<0.9){
    const count=8;
    for(let i=0;i<count;i++){
      const a=(i/count)*Math.PI*2+(t*Math.PI);
      const dr=r*(0.3+((i*0.13)%0.6));
      const sz=W*(0.05*(1-(t-0.15)/0.75));
      glow(ctx,'#00aaff',sz*3);
      ctx.fillStyle=`rgba(${i%2?0:100},${180+i*8|0},255,${(1-(t-0.15)/0.75)*0.85})`;
      ctx.beginPath(); ctx.arc(cx+Math.cos(a)*dr,cy+Math.sin(a)*dr,sz,0,Math.PI*2); ctx.fill();
      noGlow(ctx);
    }
  }
}

function drawBossExplosion(ctx,W,H,frame,total){
  const cx=W/2,cy=H/2;
  const t=frame/(total-1);
  const maxR=W*0.48;

  // Multiple overlapping blast rings
  const rings=[
    {r:t*maxR,     a:1-t,     color:`rgba(255,${60+t*40|0},0,`},
    {r:t*maxR*0.7, a:(1-t)*0.8,color:`rgba(255,${150+t*105|0},0,`},
    {r:t*maxR*1.1, a:(1-t)*0.4,color:`rgba(255,80,0,`},
  ];
  rings.forEach(ring=>{
    if(ring.r>2){
      ctx.strokeStyle=ring.color+ring.a+')';
      ctx.lineWidth=W*0.05*(1-t);
      ctx.beginPath(); ctx.arc(cx,cy,ring.r,0,Math.PI*2); ctx.stroke();
    }
  });

  // Massive fireball
  const fbR=maxR*(t<0.5?t/0.5:1-t)*1.1;
  if(fbR>0){
    glow(ctx,'#ff3300',fbR*0.5);
    ctx.fillStyle=radial(ctx,cx,cy,0,fbR,[
      [0,'#ffffff'],[0.15,'#ffee88'],[0.35,`rgba(255,${100-t*60|0},0,${1-t*0.3})`],
      [0.7,`rgba(180,${20+t*20|0},0,${0.7-t*0.4})`],[1,'transparent']
    ]);
    ctx.beginPath(); ctx.arc(cx,cy,fbR,0,Math.PI*2); ctx.fill(); noGlow(ctx);
  }

  // Heavy debris
  if(t>0.1 && t<0.9){
    const count=10;
    for(let i=0;i<count;i++){
      const a=(i/count)*Math.PI*2+(t*0.8);
      const dr=(t*maxR)*(0.2+((i*0.19)%0.7));
      const sz=W*(0.05+((i*0.11)%0.05))*(1-(t-0.1)/0.8);
      ctx.save(); ctx.translate(cx+Math.cos(a)*dr,cy+Math.sin(a)*dr);
      ctx.rotate(t*Math.PI*2+i);
      ctx.fillStyle=`rgba(${100+i*10|0},${60+i*5|0},${40+i*5|0},${(1-(t-0.1)/0.8)*0.9})`;
      ctx.fillRect(-sz,-sz*0.5,sz*2,sz); ctx.restore();
    }
  }

  // Secondary explosions (small pops at different positions)
  if(t>0.3 && t<0.95){
    const pops=[[0.3,0.25],[0.7,0.3],[0.4,0.7],[0.65,0.65]];
    pops.forEach(([px,py],i)=>{
      const pt=(t-0.3)/0.65;
      const delay=i*0.2;
      const localT=Math.max(0,Math.min(1,(pt-delay)/(1-delay)));
      if(localT>0){
        const pr=W*(0.08+i*0.03)*(localT<0.5?localT/0.5:1-localT)*2;
        glow(ctx,'#ff6600',pr*0.4);
        ctx.fillStyle=radial(ctx,W*px,H*py,0,pr,[
          [0,'#ffee44'],[0.4,'#ff4400'],[1,'transparent']
        ]);
        ctx.beginPath(); ctx.arc(W*px,H*py,pr,0,Math.PI*2); ctx.fill();
        noGlow(ctx);
      }
    });
  }

  // Thick smoke tail
  if(t>0.5){
    const smokeA=(t-0.5)/0.5*0.5;
    ctx.fillStyle=`rgba(50,45,55,${smokeA})`;
    ctx.beginPath(); ctx.arc(cx,cy-maxR*t*0.4,maxR*t*0.7,0,Math.PI*2); ctx.fill();
  }
}

// ─── Particle card builder (single-frame, larger display) ─────────────────────
function buildParticleCard(sp){
  const sc=scale();
  const card=document.createElement('div');
  card.className='sprite-card';
  const header=document.createElement('div');
  header.className='card-header';
  const pw=sp.w*sc, ph=sp.h*sc;
  header.innerHTML=`<h2>${sp.label}</h2><span class="tag">${sp.w}×${sp.h}pt · ${pw}×${ph}px@${sc}×</span>`;
  card.appendChild(header);

  const framesRow=document.createElement('div');
  framesRow.className='frames-row';
  const wrap=document.createElement('div');
  wrap.className='frame-wrap';
  const lbl=document.createElement('div');
  lbl.className='frame-label'; lbl.textContent='texture';
  const cvs=document.createElement('canvas');
  const displayScale=Math.max(2,Math.floor(80/Math.max(sp.w,sp.h)));
  cvs.width=pw; cvs.height=ph;
  cvs.style.width=(pw*displayScale)+'px';
  cvs.style.height=(ph*displayScale)+'px';
  cvs.className='sprite';
  cvs.id=`cvs_${sp.id}_0`;
  cvs.title=`Click to export ${sp.id}.png`;
  cvs.onclick=()=>exportFrame(sp,0,cvs);
  const ctx=cvs.getContext('2d');
  ctx.clearRect(0,0,pw,ph);
  sp.draw(ctx,pw,ph);
  wrap.appendChild(lbl); wrap.appendChild(cvs);
  framesRow.appendChild(wrap);
  card.appendChild(framesRow);

  const actions=document.createElement('div');
  actions.className='card-actions';
  const exportBtn=document.createElement('button');
  exportBtn.className='btn green'; exportBtn.textContent='⬇ Export PNG';
  exportBtn.onclick=()=>exportFrame(sp,0,cvs);
  actions.appendChild(exportBtn);
  card.appendChild(actions);
  document.getElementById('grid').appendChild(card);
}

// ─── Section header helper ────────────────────────────────────────────────────
function addSectionHeader(text){
  const h=document.createElement('div');
  h.style.cssText='color:#00d4ff;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:8px 0 4px;border-bottom:1px solid #1e1e3a;margin-top:8px;width:100%';
  h.textContent='── '+text+' ──';
  document.getElementById('grid').appendChild(h);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
addSectionHeader('Ships & Enemies');
SPRITES.forEach(sp=>buildCard(sp));
addSectionHeader('Explosion Animations');
EXPLOSIONS.forEach(sp=>buildCard(sp));
addSectionHeader('Particle Textures');
PARTICLES.forEach(sp=>buildParticleCard(sp));
</script>
